name: Publish NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    # Trusted publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner mint the OIDC token that npm authenticates against.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # registry-url is deliberately omitted. npm derives the OIDC audience from
      # the resolved registry, which already defaults to registry.npmjs.org and
      # is pinned by publishConfig in package.json. Setting it here only adds an
      # _authToken line to .npmrc.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Trusted publishing needs npm >=11.5.1; Node 24 does not always bundle it.
      - name: Pin npm
        run: npm install -g npm@^12.0.2

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      # npm's OIDC path never throws: on any failure it returns quietly and
      # falls back to token auth, which then reports a bare ENEEDAUTH. Checking
      # the one prerequisite npm cannot recover from turns the most common
      # misconfiguration into a legible error.
      - name: Check OIDC token is available
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::No OIDC token endpoint. This job needs 'permissions: id-token: write'."
            exit 1
          fi
          echo "OIDC token endpoint available."

      # No NODE_AUTH_TOKEN, and no --provenance flag: trusted publishing
      # authenticates over OIDC and attaches provenance by default.
      #
      # Verbose logging is deliberate. npm logs why an OIDC exchange failed at
      # verbose level only, so without it an ENEEDAUTH gives nothing to act on.
      - name: Publish to npm
        run: npm publish --loglevel verbose
